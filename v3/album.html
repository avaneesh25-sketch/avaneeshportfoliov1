<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo album · Avaneesh Pramod</title><style>body{margin:0;background:#211b16;color:#e7dbc7;font:15px system-ui}main{max-width:740px;margin:auto;padding:20px}a{color:inherit}#album-panel{margin:20px auto;box-sizing:border-box;width:100%;max-height:none} [data-close]{display:none}#album-panel{color:#30291e;background:#e8ddc3;border:1px solid #9a835b;border-radius:12px;padding:clamp(12px,3vw,24px);width:min(670px,calc(100vw - 20px));max-height:92dvh;overflow:auto;box-shadow:0 24px 100px #0009;overscroll-behavior:contain}#album-panel::backdrop{background:#17120db0}.album-header{display:flex;justify-content:space-between;align-items:start;gap:10px}.album-header h2{font:normal clamp(23px,4vw,36px) Georgia,serif;margin:6px 0 10px}.album-header small{font:10px system-ui;letter-spacing:.15em;color:#746044}.album-chapters{display:flex;gap:6px;overflow-x:auto;padding:5px 0 12px;white-space:nowrap}.album-chapters button,.album-nav button,.album-header button{font:12px system-ui;color:#3c2d1e;background:#f3ead9;border:1px solid #b6a58a;padding:8px 12px;border-radius:20px;cursor:pointer}.album-chapters button[aria-pressed=true]{background:#4c392c;color:#f4e9d6}.album-nav button:disabled{opacity:.4;cursor:default}.album-view{min-height:180px;height:min(48dvh,420px);display:flex;align-items:center;justify-content:center;background:#d8c8aa;border:1px solid #baa98b;overflow:hidden;border-radius:4px;touch-action:pan-y}.album-media{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.album-empty{text-align:center;padding:20px}.album-empty strong{font:normal 28px Georgia,serif}.album-empty p,.album-caption{font:13px/1.5 system-ui;color:#65523a}.album-caption{margin:12px 0}.album-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}</style></head><body><main><a href="./work.html">← Selected work</a> · <a href="./?station=work">3D desk</a><section id="album-panel" aria-label="Photo album"><div class="album-header"><div><small>FIELD NOTES / THE PHOTO ALBUM</small><h2 data-title>Behind the portfolio</h2></div><button type="button" data-close aria-label="Close album">×</button></div><div data-chapters class="album-chapters" aria-label="Album chapters"></div><div data-media class="album-view" aria-live="polite">Opening album…</div><div class="album-caption" data-caption></div><div class="album-nav"><button type="button" data-prev>← Previous</button><span data-counter></span><button type="button" data-next>Next →</button></div></section></main><script type="module">import {initAlbum} from './album-view.js';initAlbum(document.querySelector('#album-panel')).open();</script></body></html>
