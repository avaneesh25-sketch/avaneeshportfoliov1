name: Import listening room models
on:
  push:
    branches: [portfolio-v3]
    paths: ['scripts/import_listening_room.py','.github/workflows/import-listening-room.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/portfolio-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: portfolio-v3
      - run: python3 scripts/import_listening_room.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models
          if ! git diff --cached --quiet; then
            git commit -m "Cache listening room chair and speaker GLBs"
            git push origin HEAD:portfolio-v3
          fi
