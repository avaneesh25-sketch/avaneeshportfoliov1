name: Import V3 chair
on:
  push:
    branches: [portfolio-v3]
    paths: ['.github/workflows/import-v3-chair.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/portfolio-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: portfolio-v3
      - name: Retrieve and validate CC0 chair
        run: |
          python3 - <<'PY'
          import urllib.request, struct, json, hashlib
          from pathlib import Path
          url = 'https://tevy.dev/models/office-chair/v1/lod0.glb'
          with urllib.request.urlopen(url, timeout=45) as response:
              data = response.read(5000001)
          if len(data) > 5000000 or len(data) < 20:
              raise ValueError('Unexpected GLB size')
          magic, version, size = struct.unpack_from('<4sII', data)
          if magic != b'glTF' or version != 2 or size != len(data):
              raise ValueError('Invalid GLB header')
          length, kind = struct.unpack_from('<I4s', data, 12)
          if kind != b'JSON' or 20+length > len(data):
              raise ValueError('Invalid glTF JSON')
          doc = json.loads(data[20:20+length])
          if not doc.get('meshes') or not doc.get('nodes'):
              raise ValueError('Missing geometry')
          folder = Path('assets/models')
          folder.mkdir(parents=True, exist_ok=True)
          (folder/'chair.glb').write_bytes(data)
          (folder/'chair-import-report.json').write_text(json.dumps({'source':url,'license':'CC0 1.0','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'nodes':[n.get('name','unnamed') for n in doc['nodes']]},indent=2))
          PY
      - name: Commit only chair asset on V3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/chair.glb assets/models/chair-import-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Import CC0 ergonomic chair GLB"
            git push origin HEAD:portfolio-v3
          fi
