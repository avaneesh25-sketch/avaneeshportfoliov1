name: Import remaining V3 props
on:
  push:
    branches: [portfolio-v3]
    paths: ['scripts/import_v3_props.py','.github/workflows/import-v3-props.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/portfolio-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: portfolio-v3
      - name: Download and inspect GLB candidates
        run: python3 scripts/import_v3_props.py
      - name: Commit imported assets only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models
          if ! git diff --cached --quiet; then
            git commit -m "Import remaining V3 prop candidates and original coffee beans"
            git push origin HEAD:portfolio-v3
          fi
